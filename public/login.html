<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In - Arma Server Admin</title>
  <script src="/theme.js"></script>
  <link rel="shortcut icon" href="/favicon.ico">
  <script src="/branding.js"></script>
  <style>
    body { font: 16px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f5f6f8; color: #202630; margin: 0; padding: 32px 16px; }
    main { max-width: 360px; margin: 5vh auto; padding: 24px; background: #fff; border: 1px solid #c9cfd8; border-radius: 10px; }
    h1 { font-size: 24px; font-weight: 600; margin-top: 0; }
    label { display: block; font-weight: 600; margin: 16px 0 6px; }
    input { box-sizing: border-box; width: 100%; padding: 9px; background: #f5f6f8; color: #202630; border: 1px solid #c9cfd8; border-radius: 6px; font: inherit; }
    input:focus, button:focus-visible { outline: 2px solid #4f8cff; outline-offset: 1px; }
    button { margin-top: 20px; padding: 10px 18px; border: 1px solid #245ebc; border-radius: 6px; background: #245ebc; color: white; font: inherit; cursor: pointer; }
    button:hover { background: #1b4e9e; }
    .error { color: #a94442; }
    html[data-theme="dark"] { color-scheme: dark; }
    html[data-theme="dark"] body { background: #12151a; color: #e6e8ec; }
    html[data-theme="dark"] main { background: #1b1f27; border-color: #2b313c; }
    html[data-theme="dark"] input { background: #12151a; color: #e6e8ec; border-color: #2b313c; }
    html[data-theme="dark"] .error { color: #ff9a97; }
  </style>
</head>
<body>
<main>
  <h1>Sign In</h1>
  <form id="login-form">
    <label for="username">Username</label>
    <input id="username" autocomplete="username" required maxlength="256" autofocus>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required maxlength="256">
    <p id="error" class="error" role="alert"></p>
    <button type="submit">Sign In</button>
  </form>
</main>
<script>
  document.getElementById('login-form').addEventListener('submit', function (event) {
    event.preventDefault()
    var error = document.getElementById('error')
    var button = this.querySelector('button')
    error.textContent = ''
    button.disabled = true
    fetch('/api/session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' },
      credentials: 'same-origin',
      body: JSON.stringify({ username: document.getElementById('username').value, password: document.getElementById('password').value })
    }).then(function (response) {
      if (!response.ok) return response.text().then(function (text) { throw new Error(text || 'Unable to sign in') })
      var params = new URLSearchParams(location.search)
      location.assign(params.get('returnTo') === '/presets' ? '/presets' : '/')
    }).catch(function (err) {
      error.textContent = err.message
      button.disabled = false
    })
  })
</script>
</body>
</html>
