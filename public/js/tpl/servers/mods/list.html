<section class="panel panel-default" aria-labelledby="server-mods-heading">
  <div class="panel-heading"><h3 class="panel-title" id="server-mods-heading">Server Mods</h3></div>
  <div class="panel-body">
    <form>
      <div class="cc cc-arma3 server-mods-toolbar">
        <div class="server-mods-filter">
          <label for="include-required">Required</label>
          <div class="server-mods-filter-controls">
            <button type="button" class="btn btn-default btn-xs toggle-required">Toggle All</button>
            <input class="form-control input-sm" type="text" placeholder="battalion\" id="include-required">
            <button type="button" class="btn btn-primary btn-xs check-include-required" aria-label="Select required mods matching path"><span class="glyphicon glyphicon-check" aria-hidden="true"></span></button>
          </div>
        </div>
        <div class="server-mods-filter">
          <label for="include-optional">Optional</label>
          <div class="server-mods-filter-controls">
            <button type="button" class="btn btn-default btn-xs toggle-optional">Toggle All</button>
            <input class="form-control input-sm" type="text" placeholder="clientside\" id="include-optional">
            <button type="button" class="btn btn-primary btn-xs check-include-optional" aria-label="Select optional mods matching path"><span class="glyphicon glyphicon-check" aria-hidden="true"></span></button>
          </div>
        </div>
        <div class="server-mods-presets">
          <span class="server-mods-label">Presets</span>
          <div class="server-mods-filter-controls">
            <button type="button" class="btn btn-info btn-xs preset-battalion">Battalion Preset</button>
            <button type="button" class="btn btn-info btn-xs preset-ww2">WW2 Preset</button>
          </div>
        </div>
      </div>
      <div class="table-responsive cc cc-arma3">
        <table class="table table-striped">
          <thead class="cc cc-arma3">
            <tr>
              <th class="server-mods-checkbox-column">Server Only</th>
              <th class="server-mods-checkbox-column">Required</th>
              <th class="server-mods-checkbox-column">Optional</th>
              <th>Path</th>
              <th>Mod</th>
              <th class="text-right">Size</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="cc cc-reforger">
        <div class="form-group">
          <label for="reforger-mods">Reforger Mod Config</label>
          <textarea id="reforger-mods" rows="6" class="form-control reforger-mods" placeholder="[]"></textarea>
        </div>
        <div class="alert alert-warning">
          <p>See the <a href="https://community.bistudio.com/wiki/Arma_Reforger:Server_Config">Reforger server config</a> for the mod format. Enclose the mod entries in an array:</p>
          <pre>[
  {
    "modId": "59673B6FBB95459F",
    "name": "BetterTracers",
    "version": "1.0.5"
  }
]</pre>
        </div>
      </div>
    </form>
  </div>
</section>
