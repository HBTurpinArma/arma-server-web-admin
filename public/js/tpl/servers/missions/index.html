<div class="row">
  <div class="col-md-6 col-md-push-6">
    <section class="panel panel-default" aria-labelledby="server-rotation-heading">
      <div class="panel-heading"><h3 class="panel-title" id="server-rotation-heading">Mission Rotation</h3></div>
      <div class="panel-body" id="rotation"></div>
    </section>
  </div>
  <div class="col-md-6 col-md-pull-6">
    <section class="panel panel-default" aria-labelledby="server-available-missions-heading">
    <div class="panel-heading"><h3 class="panel-title" id="server-available-missions-heading">Available Missions</h3></div>
    <div class="panel-body">
    <form>
      <div class="form-group">
        <label for="filterMissions">Filter</label>
        <input type="text" class="form-control" id="filterMissions" placeholder="Filter missions..." value="<%-filterValue%>">
      </div>
    </form>

    <div class="table-responsive"><div id="available"></div></div>
    </div>
    </section>
  </div>
</div>
