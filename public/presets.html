<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Preset Builder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/theme.js"></script>
  <style>
    :root {
      --bg: #12151a;
      --panel: #1b1f27;
      --border: #2b313c;
      --text: #e6e8ec;
      --muted: #8b93a1;
      --accent: #4f8cff;
      --ok: #2e9e5b;
    }
    :root[data-theme="light"] {
      --bg: #f5f6f8;
      --panel: #fff;
      --border: #c9cfd8;
      --text: #202630;
      --muted: #596575;
      --accent: #245ebc;
      --ok: #237b47;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 1600px;
      margin: 0 auto;
      padding: 2em 1em;
    }
    h1 { font-weight: 600; margin: 0; }
    h2 { font-size: .8em; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 .75em; }
    h2 .count { color: var(--text); text-transform: none; letter-spacing: 0; font-weight: 400; margin-left: .4em; }
    #status { color: var(--muted); margin: .5em 0 0; }
    #status:empty { display: none; }

    .columns { display: flex; gap: 1em; align-items: stretch; margin-bottom: 1em; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1em;
      margin-bottom: 1em;
    }
    .columns > .col { display: flex; flex-direction: column; flex: 1 1 0; min-width: 0; }
    .columns > .col.narrow { flex: 0 0 240px; }
    .col .panel:last-child { margin-bottom: 0; }

    /* Absolutely positioned so the optional list stretches to the left column's height without adding to it. */
    .col.fill { position: relative; }
    .col.fill > .panel { position: absolute; inset: 0; display: flex; flex-direction: column; margin: 0; }
    .col.fill .mod-list { flex: 1 1 auto; min-height: 0; max-height: none; }

    .search { margin-top: .75em; }
    .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: .75em; min-height: 2em; }
    .panel-head h2 { margin: 0; }
    .panel-head .updated { color: var(--muted); font-size: .8em; white-space: nowrap; }
    #base, #optional-search { height: 2.5em; }
    .optional-search-row { display: flex; align-items: center; gap: .5em; }
    #optional-search { flex: 1 1 auto; min-width: 0; }
    #clear-optional { flex: 0 0 auto; height: 2.5em; padding: .25em .7em; font-size: .85em; }
    .search + .mod-list { margin-top: .5em; }
    .mod-list { max-height: 520px; overflow-y: auto; margin-top: .75em; padding-right: .5em; }
    label { display: block; padding: .25em 0; font-size: .92em; }
    label:hover { color: var(--accent); }
    .mod-item { display: flex; align-items: center; gap: .5em; user-select: none; }
    button, .dlc-item { user-select: none; }
    .mod-item input { margin: 0; flex: 0 0 auto; }
    .mod-name { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mod-link { color: var(--muted); text-decoration: none; margin-left: 0; flex: 0 0 auto; display: inline-flex; }
    .mod-link:hover { color: var(--accent); }
    [hidden] { display: none !important; }
    input[type="checkbox"] { accent-color: var(--accent); margin-right: .4em; }
    input[type="checkbox"]:disabled { opacity: .6; }
    input[type="checkbox"]:focus:not(:focus-visible) { outline: none; }

    select, input[type="text"], input[type="search"], input:not([type]) {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: .5em .7em;
      font: inherit;
      width: 100%;
    }
    select:focus, input:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

    button {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: .5em .9em;
      font: inherit;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    button:hover { border-color: var(--accent); }
    #dlc button { background: transparent; border: 0; border-radius: 999px 0 0 999px; color: inherit; padding: .4em .4em .4em .9em; }
    .dlc-item { display: inline-flex; align-items: center; gap: .15em; margin: 0 .6em .5em 0; background: var(--bg); border: 1px solid var(--border); border-radius: 999px; padding-right: .6em; }
    .dlc-item:hover { border-color: var(--accent); }
    .dlc-item.owned { background: var(--ok); border-color: var(--ok); color: #fff; }
    .dlc-link { display: inline-flex; color: var(--muted); padding: .2em; }
    .dlc-link:hover { color: var(--accent); }
    .dlc-item.owned .dlc-link { color: rgba(255, 255, 255, .75); }
    .dlc-item.owned .dlc-link:hover { color: #fff; }
    .set-row { display: flex; gap: .4em; margin-bottom: .5em; }
    .set-row .set-apply { flex: 1; min-width: 0; text-align: left; }
    .set-row .set-apply[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
    .set-row .set-delete { flex: 0 0 auto; color: #ff6b6b; }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 1em; flex-wrap: wrap; margin-bottom: 1em; }
    #auth-status { color: var(--muted); font-size: .9em; margin-left: .5em; }
    #admin-save { margin-top: 1em; }
    #admin-save input { margin-bottom: .5em; }
    #admin-save button { width: 100%; }
    #download { background: var(--accent); border-color: var(--accent); color: #fff; }
    .dlc-hint { color: var(--muted); font-size: .85em; margin: 0 0 .75em; }

    .actions { display: flex; gap: .75em; align-items: center; flex-wrap: wrap; }
    .actions label { display: flex; align-items: center; gap: .5em; flex: 1 1 240px; padding: 0; }
    .actions label input { flex: 1; }
    .name-field { display: flex; flex: 1; align-items: center; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding-right: .7em; }
    .name-field:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
    .name-field input { border: 0; background: transparent; outline: none; }
    .name-field .ext { color: var(--muted); }
    #share-status { color: var(--muted); font-size: .9em; }
    #set-status { color: var(--muted); font-size: .9em; }

    @media (max-width: 800px) {
      .columns { flex-direction: column; }
      .columns > .col, .columns > .col.narrow { flex: 1 1 auto; width: 100%; }
      .col.fill > .panel { position: static; }
      .col.fill .mod-list { max-height: 520px; }
    }
  </style>
</head>
<body>
  <header class="top">
    <h1>AM2 Preset Builder</h1>
    <div>
      <button id="login" type="button">Login</button>
      <span id="auth-status"></span>
      <button id="logout" type="button" hidden>Log out</button>
    </div>
  </header>
  <p id="status">Loading presets...</p>

  <div class="columns">
    <div class="col">
      <section class="panel">
        <div class="panel-head">
          <h2>Required mods <span id="base-count" class="count"></span></h2>
          <span id="base-updated" class="updated"></span>
        </div>
        <select id="base"></select>
        <div id="base-mods" class="mod-list"></div>
      </section>

      <section class="panel">
        <h2>DLC owned</h2>
        <p class="dlc-hint">Select the DLC you own. Unselected DLC adds its compatibility patch.</p>
        <div id="dlc"></div>
      </section>
    </div>

    <div class="col fill">
      <section class="panel">
        <div class="panel-head">
          <h2>Optional mods <span id="optional-count" class="count"></span></h2>
          <span id="optional-updated" class="updated"></span>
        </div>
        <div class="optional-search-row">
          <input type="search" id="optional-search" placeholder="Search optional mods...">
          <button id="clear-optional" type="button">Clear all</button>
        </div>
        <div id="optional" class="mod-list"></div>
      </section>
    </div>

    <div class="col narrow">
      <div id="sets"></div>
      <section id="admin-save" class="panel" hidden>
        <h2>Save set</h2>
        <input id="set-name" placeholder="Set name">
        <button id="save-set" type="button">Save Set</button>
        <p id="set-status"></p>
      </section>
    </div>
  </div>

  <section class="panel">
    <h2>Download</h2>
    <div class="actions">
      <label>Name <span class="name-field"><input id="name" value="Custom Preset"><span class="ext">.html</span></span></label>
      <button id="download" type="button">Download</button>
      <button id="share" type="button">Copy Share Link</button>
      <span id="share-status"></span>
    </div>
  </section>

  <script src="/presets.js"></script>
</body>
</html>
